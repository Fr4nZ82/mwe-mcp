<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="mwe-mcp">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- bg is transparent; set a <rect> here if you need an opaque tile -->
  <g filter="url(#glow)">
    <!-- edges -->
    <g stroke="#34e1a8" stroke-width="1.6" stroke-linecap="round" opacity=".75" fill="none">
      <line x1="29" y1="33" x2="11" y2="23"/>
      <line x1="29" y1="33" x2="47" y2="15"/>
      <line x1="29" y1="33" x2="43" y2="53"/>
      <line x1="29" y1="33" x2="55" y2="35"/>
      <line x1="11" y1="23" x2="26" y2="11"/>
      <line x1="26" y1="11" x2="47" y2="15"/>
      <line x1="47" y1="15" x2="55" y2="35"/>
      <line x1="43" y1="53" x2="16" y2="50"/>
      <line x1="16" y1="50" x2="11" y2="23"/>
      <line x1="16" y1="50" x2="29" y2="33"/>
    </g>
    <!-- hollow nodes (centre punched to bg colour) -->
    <g fill="#050d0b" stroke="#34e1a8" stroke-width="1.6">
      <circle cx="11" cy="23" r="3"/>
      <circle cx="26" cy="11" r="2.6"/>
      <circle cx="55" cy="35" r="2.8"/>
      <circle cx="16" cy="50" r="2.8"/>
    </g>
    <!-- filled nodes -->
    <g fill="#34e1a8">
      <circle cx="47" cy="15" r="3.4"/>
      <circle cx="43" cy="53" r="3"/>
    </g>
    <!-- active hub -->
    <circle cx="29" cy="33" r="5" fill="#6bffcb"/>
    <circle cx="29" cy="33" r="2.1" fill="#050d0b"/>
  </g>
</svg>
