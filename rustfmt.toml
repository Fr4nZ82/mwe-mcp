edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
match_block_trailing_comma = true
fn_params_layout = "Tall"

# Only stable options: `cargo fmt` on the pinned stable toolchain ignores
# nightly-only keys (`imports_granularity`, `group_imports`) with a warning
# on every run, and CI checks formatting on stable.
