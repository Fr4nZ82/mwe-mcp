name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    # Pinned, and raised on purpose rather than on Rust's schedule: this job
    # lints at pedantic + nursery with `-D warnings`, so on `stable` a release
    # that adds a lint turns it red on code nobody touched. 1.98 did exactly
    # that. `RUSTUP_TOOLCHAIN` is what makes the pin bite — `rust-toolchain.toml`
    # says `stable` and outranks the default the action sets.
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # All three are the gate. `mwe-mcp` ships prebuilt binaries for Linux,
    # macOS and Windows, so a suite that is green on one of them says
    # nothing about what the other two download. `fail-fast: false` runs
    # every OS to completion, and `--no-fail-fast` every test within it, so
    # one red platform still reports the whole picture.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets --no-fail-fast
      # The measurement harnesses in `crates/mwe-core/examples/` sit behind
      # `local-embedder`, so the line above never builds them — and on
      # 2026-08-04 two of them (`nav_replay`, `room_walk`) turned out to have
      # been broken for a day by a type change, discovered only when one was
      # needed to answer a question. They are how every recall claim gets
      # measured; a rotted instrument is worse than a missing one, because it
      # is found at the moment it is trusted. Build-only: they need a workdir
      # to run.
      - run: cargo build --workspace --examples --features local-embedder

  # `rust-version` in Cargo.toml is the compatibility promise; `stable`
  # above is only where development happens. A promise nobody compiles
  # against is a number in a file, so this job checks the whole workspace
  # (tests and examples included) on exactly the declared floor.
  msrv:
    name: cargo check (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `check` runs bans + licenses + sources + advisories. The
          # standalone `cargo audit` job is redundant — same advisory
          # database, fewer ignore lists to keep in sync — so we drop
          # it and use deny.toml as the single source of policy.
          command: check
