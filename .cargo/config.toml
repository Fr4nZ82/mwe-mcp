[alias]
# The binary you deploy. `--features local-embedder` compiles the Candle
# stack that runs bge-m3 into the binary (the weights themselves are
# fetched at first use, not embedded), which every deployment configured
# with `embedding.backend: bundled` requires — and a plain `cargo build
# --release` fails only at RUNTIME, after the migrations and the boot
# passes have already run, leaving systemd to restart-loop a service
# that still reports itself active. Deploy with `cargo prod` so the flag
# cannot be forgotten. (Sanity check: the right binary is ~38 MB; the
# Candle stack is around 6 MB of that, so a build that dropped the flag
# comes out that much smaller.)
prod = "build --release --features local-embedder"

[net]
git-fetch-with-cli = true
